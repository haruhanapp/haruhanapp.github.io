<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>하루한앱 지표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:light;
  --bg:#f4f3ef;--card:#ffffff;--line:#e7e5df;--grid:#efede8;
  --ink:#16161a;--ink2:#55534e;--ink3:#8b8983;
  --chip:#ecebe6;--chip-on:#16161a;--chip-on-ink:#ffffff;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
  --up:#0f8a3c;--down:#c8372d;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 6px 20px rgba(20,20,20,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121212;--card:#1c1c1b;--line:#2c2c2a;--grid:#262624;
    --ink:#f0efec;--ink2:#c3c2b7;--ink3:#8e8d86;
    --chip:#262624;--chip-on:#f0efec;--chip-on-ink:#121212;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;
    --up:#3fbf6a;--down:#ef6a5f;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121212;--card:#1c1c1b;--line:#2c2c2a;--grid:#262624;
  --ink:#f0efec;--ink2:#c3c2b7;--ink3:#8e8d86;
  --chip:#262624;--chip-on:#f0efec;--chip-on-ink:#121212;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;
  --up:#3fbf6a;--down:#ef6a5f;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.45;word-break:keep-all;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
button,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 40px}

/* 잠금 */
#lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lock-box{width:100%;max-width:340px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:18px;letter-spacing:-.5px}
.brand b{display:block;font-size:20px;letter-spacing:-.4px}
.brand span{font-size:13px;color:var(--ink3)}
.field{display:block;width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:16px;outline:none}
.field:focus{border-color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:52px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;margin-top:10px;cursor:pointer}
.btn:disabled{opacity:.5}
.check{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--ink2)}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.err{min-height:20px;margin-top:10px;font-size:14px;color:var(--down)}

/* 위 막대 */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top{max-width:1040px;margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;gap:10px}
.top .logo{width:32px;height:32px;border-radius:10px;font-size:14px}
.top h1{font-size:17px;margin:0;letter-spacing:-.3px;flex:1;min-width:0}
.icon-btn{width:36px;height:36px;border-radius:10px;border:0;background:var(--chip);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:18px;height:18px;stroke:var(--ink2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs{max-width:1040px;margin:0 auto;padding:10px 16px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--chip);color:var(--ink2);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--chip-on);color:var(--chip-on-ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:none;height:28px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stamp{font-size:12px;color:var(--ink3);text-align:right}
.demo{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:#fff1d6;color:#8a5a00;margin-left:6px;vertical-align:1px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .demo{background:#3a2c10;color:#f2c56b}}

.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px}
.card + .card,.grid + .card,.card + .grid,.two + .card,.card + .two{margin-top:12px}
.card h2{font-size:15px;margin:0;letter-spacing:-.2px}
.card .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}

/* 숫자 칸 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:14px 14px 12px;min-width:0}
.tile .lb{font-size:13px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-top:4px;line-height:1.15}
.tile .v small{font-size:14px;font-weight:700;margin-left:1px;color:var(--ink2)}
.tile .d{font-size:12px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--up)}.down{color:var(--down)}

/* 전체 */
.game{display:block;width:100%;text-align:left;border:1px solid var(--line);cursor:pointer}
.game-top{display:flex;align-items:center;gap:8px}
.game-top b{font-size:16px;letter-spacing:-.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{font-size:12px;font-weight:600;color:var(--ink3);flex:none}
.state.ok{color:var(--up)}
.game-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 96px;gap:8px;align-items:end;margin-top:12px}
.game-row .lb{font-size:12px;color:var(--ink3)}
.game-row .v{font-size:20px;font-weight:800;letter-spacing:-.5px}
.game-row svg{width:96px;height:36px;display:block}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.steps span{font-size:12px;font-weight:600;color:var(--ink2);background:var(--chip);border-radius:8px;padding:4px 9px}

/* 그래프 */
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-size:11px;fill:var(--ink3);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.4;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:2}
.tip b{font-size:13px}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;color:var(--ink3);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-size:12px}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--grid)}
tr:last-child td{border-bottom:0}
.heat{display:inline-block;min-width:52px;padding:2px 6px;border-radius:6px}
.na{color:var(--ink3)}

.split{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0 10px}
.split div{height:100%}
.split-legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.split-legend .lb{font-size:12px;color:var(--ink2)}
.split-legend .v{font-size:17px;font-weight:800;letter-spacing:-.4px}

.empty{padding:28px 8px;text-align:center;color:var(--ink3);font-size:14px}
.two{display:grid;grid-template-columns:1fr;gap:12px}
.two .card{margin-top:0}
@media (min-width:720px){.two{grid-template-columns:1fr 1fr}}
footer{font-size:12px;color:var(--ink3);text-align:center;margin-top:24px}
[hidden]{display:none!important}
</style>
</head>
<body>

<section id="lock">
  <form class="lock-box" id="lockForm" autocomplete="on">
    <div class="brand"><div class="logo">하</div><div><b>하루한앱 지표</b><span>관리자 전용</span></div></div>
    <input type="text" name="username" value="haruhanapp" autocomplete="username" hidden>
    <input class="field" id="pw" type="password" placeholder="비밀번호" autocomplete="current-password" aria-label="비밀번호">
    <label class="check"><input type="checkbox" id="remember" checked> 이 기기에서 기억</label>
    <button class="btn" id="enter" type="submit">들어가기</button>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="top">
      <div class="logo">하</div>
      <h1>하루한앱 지표<span class="demo" id="demoChip" hidden>예시 숫자 · 실제 아님</span></h1>
      <button class="icon-btn" id="reload" aria-label="새로고침"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="icon-btn" id="lockBtn" aria-label="잠그기"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>
  <main class="wrap">
    <div class="bar">
      <div class="seg" id="range">
        <button data-n="7">7일</button><button data-n="30">30일</button><button data-n="90">90일</button>
      </div>
      <div class="stamp num" id="stamp"></div>
    </div>
    <div id="view"></div>
    <footer>한국 시간 기준 · 숫자만 모아요</footer>
  </main>
</div>

<script>
// ── 게임 목록: 새 게임은 여기 한 줄. url = https://<프로젝트ID>.supabase.co/functions/v1/dash
const GAMES = [
  { id: 'alkkagi',    name: '이겨라 알까기', short: '알까기', color: '#b7793a', url: '' },
  { id: 'mukjjippa',  name: '이겨라 묵찌빠', short: '묵찌빠', color: '#e2574c', url: '' },
  { id: 'terrafront', name: 'TERRAFRONT',    color: '#2f8f83', url: '' },
];

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => n == null ? '–' : Number(n).toLocaleString('ko-KR');
const pct = (n) => n == null ? '–' : `${Number(n).toFixed(1)}%`;
const md = (d) => { const [, m, dd] = d.split('-'); return `${+m}.${+dd}`; };
const W = ['일', '월', '화', '수', '목', '금', '토'];
const wd = (d) => W[new Date(d + 'T00:00:00+09:00').getUTCDay()] ?? '';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

const DEMO = new URLSearchParams(location.search).has('demo');
let key = store.get('dash.key') || sessionStorage.getItem?.('dash.key') || '';
let range = +(store.get('dash.range') || 30);
let tab = store.get('dash.tab') || 'all';
const data = {};      // id → { ok, d } | { err }
let loading = false;

// ── 서버 ─────────────────────────────
async function fetchGame(g, n) {
  if (!g.url) return { err: 'none' };
  if (DEMO) return { ok: true, d: demo(g.id, n) };
  try {
    const r = await fetch(g.url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-dash-key': key }, body: JSON.stringify({ days: n }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok) return { ok: true, d: j };
    return { err: j.error || `http_${r.status}` };
  } catch { return { err: 'network' }; }
}
async function loadAll() {
  loading = true; $('#reload').classList.add('spin');
  const res = await Promise.all(GAMES.map((g) => fetchGame(g, range)));
  GAMES.forEach((g, i) => { data[g.id] = res[i]; });
  loading = false; $('#reload').classList.remove('spin');
  const linked = res.filter((r) => r.err !== 'none');
  if (linked.length && linked.every((r) => r.err === 'wrong_key')) { lock('비밀번호가 달라요'); return false; }
  $('#stamp').textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }) + ' 기준';
  render();
  return true;
}

// ── 잠금 ─────────────────────────────
function lock(msg = '') {
  key = ''; store.set('dash.key', null); try { sessionStorage.removeItem('dash.key'); } catch {}
  $('#app').hidden = true; $('#lock').hidden = false; $('#lockErr').textContent = msg; $('#pw').value = ''; $('#pw').focus();
}
$('#lockForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = $('#pw').value.trim();
  if (!v && !DEMO) { $('#lockErr').textContent = '비밀번호를 넣어 주세요'; return; }
  key = v; $('#enter').disabled = true; $('#lockErr').textContent = '';
  if ($('#remember').checked) store.set('dash.key', key); else try { sessionStorage.setItem('dash.key', key); } catch {}
  open_();
  await loadAll();
  $('#enter').disabled = false;
});
function open_() { $('#lock').hidden = true; $('#app').hidden = false; $('#demoChip').hidden = !DEMO; }
$('#lockBtn').onclick = () => lock();
$('#reload').onclick = () => { if (!loading) loadAll(); };
$('#range').addEventListener('click', (e) => {
  const n = +e.target.dataset?.n; if (!n || n === range) return;
  range = n; store.set('dash.range', String(n)); syncRange(); loadAll();
});
function syncRange() { for (const b of $('#range').children) b.setAttribute('aria-pressed', String(+b.dataset.n === range)); }

// ── 그리기 ───────────────────────────
function render() {
  const tabs = [{ id: 'all', name: '전체' }, ...GAMES];
  if (!tabs.some((t) => t.id === tab)) tab = 'all';
  $('#tabs').innerHTML = tabs.map((t) => `<button class="tab" role="tab" data-id="${t.id}" aria-selected="${t.id === tab}">${t.color ? `<i class="dot" style="background:${t.color}"></i>` : ''}${esc(t.short || t.name)}</button>`).join('');
  const v = $('#view');
  v.innerHTML = '';
  if (tab === 'all') renderAll(v); else renderGame(v, GAMES.find((g) => g.id === tab));
}
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab'); if (!b) return;
  tab = b.dataset.id; store.set('dash.tab', tab); render(); window.scrollTo({ top: 0 });
});

const ERR = { none: '연결 전', network: '연결 안 됨', not_configured: '비밀번호 설정 전', wrong_key: '비밀번호 다름', db_error: '서버 오류' };
const STEPS = ['1 dash 함수', '2 DASH_KEY', '3 주소 넣기'];
const today = (d) => d.days[d.days.length - 1] || {};
const prev = (d) => d.days[d.days.length - 2] || {};

function renderAll(v) {
  // 오늘 합계
  const ok = GAMES.filter((g) => data[g.id]?.ok);
  const sum = (f) => ok.reduce((s, g) => s + (f(data[g.id].d) || 0), 0);
  const tiles = [
    ['오늘 DAU', sum((d) => today(d).dau), sum((d) => prev(d).dau)],
    ['오늘 신규', sum((d) => today(d).new), sum((d) => prev(d).new)],
    ['오늘 판 수', sum((d) => today(d).games), sum((d) => prev(d).games)],
  ];
  v.insertAdjacentHTML('beforeend', `<div class="grid">${tiles.map(([l, a, b]) => tile(l, fmt(a), delta(a, b))).join('')}${tile('가입자', fmt(sum((d) => d.totals?.players)), `<span>연결 ${ok.length}/${GAMES.length}</span>`)}</div>`);
  for (const g of GAMES) {
    const r = data[g.id] || { err: 'none' };
    const el = document.createElement('button');
    el.className = 'card game';
    if (r.ok) {
      const t = today(r.d);
      el.innerHTML = `<div class="game-top"><i class="dot" style="background:${g.color}"></i><b>${esc(g.name)}</b><span class="state ok">연결됨</span></div>
        <div class="game-row num">
          <div><div class="lb">DAU</div><div class="v">${fmt(t.dau)}</div></div>
          <div><div class="lb">신규</div><div class="v">${fmt(t.new)}</div></div>
          <div><div class="lb">판 수</div><div class="v">${fmt(t.games)}</div></div>
          ${spark(r.d.days.slice(-14).map((x) => x.dau))}
        </div>`;
    } else {
      el.innerHTML = `<div class="game-top"><i class="dot" style="background:${g.color}"></i><b>${esc(g.name)}</b><span class="state">${ERR[r.err] || '오류'}</span></div>
        ${r.err === 'none' || r.err === 'not_configured' ? `<div class="steps">${STEPS.map((s) => `<span>${s}</span>`).join('')}</div>` : ''}`;
    }
    el.onclick = () => { tab = g.id; store.set('dash.tab', tab); render(); window.scrollTo({ top: 0 }); };
    v.appendChild(el);
  }
}

function tile(label, value, sub = '') { return `<div class="tile"><div class="lb">${label}</div><div class="v num">${value}</div><div class="d num">${sub || '&nbsp;'}</div></div>`; }
// 오늘은 아직 하루가 안 끝나서 증감 대신 어제 값만 나란히
function delta(a, b) { return b == null ? '' : `어제 ${fmt(b)}`; }
function avgW(rows, k) { // 신규 수로 가중 평균
  const xs = rows.filter((r) => r[k] != null && r.new > 0);
  const n = xs.reduce((s, r) => s + r.new, 0);
  return n ? xs.reduce((s, r) => s + r[k] * r.new, 0) / n : null;
}
function rate(rows, a, b) { const x = rows.reduce((s, r) => s + (r[a] || 0), 0), y = rows.reduce((s, r) => s + (r[b] || 0), 0); return y ? x * 100 / y : null; }

function renderGame(v, g) {
  const r = data[g.id] || { err: 'none' };
  if (!r.ok) {
    v.innerHTML = `<div class="card"><div class="card-head"><div><h2>${esc(g.name)}</h2><div class="sub">${ERR[r.err] || '오류'}</div></div></div>
      ${r.err === 'none' || r.err === 'not_configured' ? `<div class="steps" style="margin-top:0">${STEPS.map((s) => `<span>${s}</span>`).join('')}</div>` : `<div class="empty">잠시 뒤 새로고침</div>`}</div>`;
    return;
  }
  const d = r.d, t = today(d), y = prev(d), days = d.days, last7 = days.slice(-7);
  const d1 = avgW(d.retention.slice(0, 14), 'd1'), d7 = avgW(d.retention.slice(0, 21), 'd7');
  const adPct = rate(last7, 'ad_earned', 'ad_show');
  const mw = last7.filter((x) => x.match_pct != null);
  const matchPct = mw.length ? mw.reduce((s, x) => s + x.match_pct, 0) / mw.length : null;
  const waits = last7.filter((x) => x.wait_sec != null);
  const wait = waits.length ? waits.reduce((s, x) => s + x.wait_sec, 0) / waits.length : null;
  v.insertAdjacentHTML('beforeend', `<div class="grid">
    ${tile('오늘 DAU', fmt(t.dau), delta(t.dau, y.dau))}
    ${tile('오늘 신규', fmt(t.new), delta(t.new, y.new))}
    ${tile('오늘 판 수', fmt(t.games), delta(t.games, y.games))}
    ${tile('D1 잔존', d1 == null ? '–' : d1.toFixed(1) + '<small>%</small>', d7 == null ? 'D7 –' : `D7 ${d7.toFixed(1)}%`)}
    ${tile('광고 완주', adPct == null ? '–' : adPct.toFixed(1) + '<small>%</small>', '최근 7일')}
    ${tile('매칭 성공', matchPct == null ? '–' : matchPct.toFixed(1) + '<small>%</small>', wait == null ? '대기 –' : `평균 대기 ${wait.toFixed(1)}초`)}
  </div>`);

  card(v, 'DAU', `${range}일`, (el) => lineChart(el, days.map((x) => ({ x: x.day, y: x.dau })), 'DAU'));
  card(v, '판 수', '사람 대전 · 그 외', (el) => barChart(el, days, [
    { k: 'games_pvp', name: '사람 대전', c: 'var(--s1)' },
    { k: (x) => Math.max(0, x.games - x.games_pvp), name: '그 외', c: 'var(--s2)' },
  ]), legend([['사람 대전', 'var(--s1)'], ['그 외', 'var(--s2)']]));

  const two = document.createElement('div'); two.className = 'two'; v.appendChild(two);
  card(two, '신규', `${range}일`, (el) => barChart(el, days, [{ k: 'new', name: '신규', c: 'var(--s1)' }]));
  card(two, '광고', '보상형 끝까지 본 수', (el) => barChart(el, days, [{ k: 'ad_earned', name: '끝까지', c: 'var(--s3)' }, { k: (x) => Math.max(0, x.ad_show - x.ad_earned), name: '중간 이탈', c: 'var(--s2)' }]),
    legend([['끝까지', 'var(--s3)'], ['중간 이탈', 'var(--s2)']]));

  // 잔존 표
  const rows = d.retention.slice(0, 14);
  card(v, '잔존', '처음 온 날 기준', (el) => {
    if (!rows.length) { el.innerHTML = '<div class="empty">아직 없음</div>'; return; }
    el.innerHTML = `<table class="num"><thead><tr><th>처음 온 날</th><th>신규</th><th>D1</th><th>D7</th></tr></thead><tbody>${rows.map((x) =>
      `<tr><td>${md(x.day)} <span class="na">${wd(x.day)}</span></td><td>${fmt(x.new)}</td><td>${heat(x.d1)}</td><td>${heat(x.d7)}</td></tr>`).join('')}</tbody></table>`;
  });

  // 유저 구성
  const T = d.totals || {};
  const parts = [['토스', T.toss || 0, 'var(--s1)'], ['플레이', T.play || 0, 'var(--s3)'], ['로그인 전', T.guest || 0, 'var(--ink3)']];
  const all = parts.reduce((s, p) => s + p[1], 0) || 1;
  card(v, '가입자', `전체 ${fmt(T.players)} · 7일 활동 ${fmt(T.active7)}`, (el) => {
    el.innerHTML = `<div class="split">${parts.filter((p) => p[1]).map((p) => `<div style="width:${p[1] * 100 / all}%;background:${p[2]}" title="${p[0]} ${fmt(p[1])}"></div>`).join('')}</div>
      <div class="split-legend num">${parts.map((p) => `<div><div class="lb"><i class="dot" style="display:inline-block;background:${p[2]};margin-right:5px"></i>${p[0]}</div><div class="v">${fmt(p[1])}</div></div>`).join('')}</div>
      <div class="split-legend num" style="margin-top:12px;padding-top:12px;border-top:1px solid var(--grid)">
        <div><div class="lb">사람 대전 누적</div><div class="v">${fmt(T.pvp_total)}</div></div>
        <div><div class="lb">토스 프로모션</div><div class="v">${fmt(T.promo_total)}</div></div>
        <div><div class="lb">튜토리얼 완료</div><div class="v">${pct(avgSimple(last7, 'tut_pct'))}</div></div>
      </div>`;
  });
}
function avgSimple(rows, k) { const xs = rows.filter((r) => r[k] != null); return xs.length ? xs.reduce((s, r) => s + r[k], 0) / xs.length : null; }
function heat(v) {
  if (v == null) return '<span class="na">–</span>';
  const a = Math.min(1, v / 60) * 0.32 + 0.06;
  return `<span class="heat" style="background:color-mix(in srgb,var(--s1) ${Math.round(a * 100)}%,transparent)">${v.toFixed(1)}%</span>`;
}
function legend(items) { return `<div class="legend">${items.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join('')}</div>`; }
function card(parent, title, sub, draw, extra = '') {
  const c = document.createElement('section'); c.className = 'card';
  c.innerHTML = `<div class="card-head"><div><h2>${title}</h2><div class="sub">${sub}</div></div>${extra}</div><div class="body"></div>`;
  parent.appendChild(c);
  const body = c.querySelector('.body');
  const go = () => draw(body);
  go(); body._redraw = go;
}

// 작은 선 (전체 화면 게임 카드)
function spark(vals) {
  const w = 96, h = 36, max = Math.max(1, ...vals), n = vals.length;
  const pts = vals.map((v, i) => `${(i * (w - 4) / Math.max(1, n - 1) + 2).toFixed(1)},${(h - 3 - v / max * (h - 8)).toFixed(1)}`).join(' ');
  const lastX = (w - 2), lastY = h - 3 - vals[n - 1] / max * (h - 8);
  return `<svg viewBox="0 0 ${w} ${h}" aria-label="최근 14일 DAU"><polyline points="${pts}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lastX}" cy="${lastY.toFixed(1)}" r="3" fill="var(--s1)"/></svg>`;
}

function niceMax(m) { if (m <= 4) return 4; const p = 10 ** Math.floor(Math.log10(m)); const s = [1, 2, 2.5, 5, 10].find((k) => k * p >= m / 4 * 1) * p; return Math.ceil(m / s) * s; }
function axis(max) { const step = max / 4; return [0, 1, 2, 3, 4].map((i) => Math.round(step * i)); }
function xTicks(n, w) { const want = Math.min(n, Math.max(3, Math.floor((w - 40) / 64))); const out = []; for (let i = 0; i < want; i++) out.push(Math.round(i * (n - 1) / Math.max(1, want - 1))); return [...new Set(out)]; }
const H = 180, PAD = { l: 34, r: 8, t: 10, b: 24 };

function lineChart(el, pts, name) {
  const w = Math.max(260, el.clientWidth), n = pts.length;
  const max = niceMax(Math.max(...pts.map((p) => p.y || 0)));
  const X = (i) => PAD.l + i * (w - PAD.l - PAD.r) / Math.max(1, n - 1);
  const Y = (v) => PAD.t + (H - PAD.t - PAD.b) * (1 - v / max);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y || 0).toFixed(1)}`).join('');
  const area = `${path}L${X(n - 1).toFixed(1)},${Y(0)}L${X(0).toFixed(1)},${Y(0)}Z`;
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${w} ${H}" height="${H}" role="img" aria-label="${name} 추이">
    ${axis(max).map((v) => `<line x1="${PAD.l}" x2="${w - PAD.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${PAD.l - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('')}
    ${xTicks(n, w).map((i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${md(pts[i].x)}</text>`).join('')}
    <path d="${area}" fill="var(--s1)" opacity=".08"/>
    <path d="${path}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="cx" y1="${PAD.t}" y2="${H - PAD.b}" stroke="var(--ink3)" stroke-dasharray="3 3" opacity="0"/>
    <circle class="pt" r="4.5" fill="var(--s1)" stroke="var(--card)" stroke-width="2" opacity="0"/>
    <circle cx="${X(n - 1)}" cy="${Y(pts[n - 1].y || 0)}" r="4" fill="var(--s1)" stroke="var(--card)" stroke-width="2"/>
  </svg><div class="tip"></div></div>`;
  hover(el, w, n, X, (i) => {
    const p = pts[i];
    $('.cx', el).setAttribute('x1', X(i)); $('.cx', el).setAttribute('x2', X(i)); $('.cx', el).setAttribute('opacity', 1);
    const c = $('.pt', el); c.setAttribute('cx', X(i)); c.setAttribute('cy', Y(p.y || 0)); c.setAttribute('opacity', 1);
    return `${md(p.x)} (${wd(p.x)})<br><b>${name} ${fmt(p.y)}</b>`;
  }, () => { $('.cx', el).setAttribute('opacity', 0); $('.pt', el).setAttribute('opacity', 0); });
}

function barChart(el, rows, series) {
  const w = Math.max(260, el.clientWidth), n = rows.length;
  const val = (s, r) => typeof s.k === 'function' ? s.k(r) : (r[s.k] || 0);
  const tot = rows.map((r) => series.reduce((a, s) => a + val(s, r), 0));
  const max = niceMax(Math.max(...tot));
  const step = (w - PAD.l - PAD.r) / n, bw = Math.max(2, Math.min(22, step - (n > 40 ? 1 : 2)));
  const X = (i) => PAD.l + step * i + step / 2;
  const Y = (v) => PAD.t + (H - PAD.t - PAD.b) * (1 - v / max);
  const rad = Math.min(4, bw / 2);
  let bars = '';
  rows.forEach((r, i) => {
    let base = 0;
    const segs = series.map((s) => ({ s, v: val(s, r) })).filter((x) => x.v > 0);
    segs.forEach((x, j) => {
      const y0 = Y(base), y1 = Y(base + x.v); base += x.v;
      const top = j === segs.length - 1;
      const h = Math.max(1, y0 - y1 - (j ? 2 : 0)); // 칸 사이 2px 틈
      const x0 = X(i) - bw / 2, yy = y0 - (j ? 2 : 0) - h;
      bars += top && h > rad
        ? `<path d="M${x0},${yy + h}V${yy + rad}Q${x0},${yy} ${x0 + rad},${yy}H${x0 + bw - rad}Q${x0 + bw},${yy} ${x0 + bw},${yy + rad}V${yy + h}Z" fill="${x.s.c}"/>`
        : `<rect x="${x0}" y="${yy}" width="${bw}" height="${h}" fill="${x.s.c}"/>`;
    });
  });
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${w} ${H}" height="${H}" role="img">
    ${axis(max).map((v) => `<line x1="${PAD.l}" x2="${w - PAD.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text x="${PAD.l - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('')}
    ${xTicks(n, w).map((i) => `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${md(rows[i].day)}</text>`).join('')}
    <rect class="hl" y="${PAD.t}" height="${H - PAD.t - PAD.b}" fill="var(--ink)" opacity="0" rx="4"/>
    ${bars}
  </svg><div class="tip"></div></div>`;
  hover(el, w, n, X, (i) => {
    const h = $('.hl', el); h.setAttribute('x', X(i) - step / 2); h.setAttribute('width', step); h.setAttribute('opacity', .05);
    const r = rows[i];
    return `${md(r.day)} (${wd(r.day)})${series.map((s) => `<br><i style="background:${s.c}"></i>${s.name} <b>${fmt(val(s, r))}</b>`).join('')}`;
  }, () => $('.hl', el).setAttribute('opacity', 0));
}

function hover(el, w, n, X, show, hide) {
  const box = $('.chart', el), tip = $('.tip', el), svg = $('svg', el);
  const at = (ev) => {
    const rc = svg.getBoundingClientRect();
    const px = (ev.clientX - rc.left) * w / rc.width;
    let best = 0, bd = 1e9;
    for (let i = 0; i < n; i++) { const dd = Math.abs(X(i) - px); if (dd < bd) { bd = dd; best = i; } }
    tip.innerHTML = show(best);
    const tx = X(best) * rc.width / w, tw = tip.offsetWidth;
    tip.style.left = Math.min(rc.width - tw, Math.max(0, tx - tw / 2)) + 'px';
    tip.style.top = '-6px'; tip.style.transform = 'translateY(-100%)';
    tip.style.opacity = 1;
  };
  box.addEventListener('pointermove', at);
  box.addEventListener('pointerdown', at);
  box.addEventListener('pointerleave', () => { tip.style.opacity = 0; hide(); });
}
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => document.querySelectorAll('.body').forEach((b) => b._redraw?.()), 120); });

// ── 예시 데이터 (?demo) ─────────────────
function demo(id, n) {
  let s = [...id].reduce((a, c) => a + c.charCodeAt(0), 7);
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const scale = { alkkagi: 1, mukjjippa: 2.4, terrafront: 0.35 }[id] || 1;
  const now = new Date(Date.now() + 9 * 3600e3);
  const days = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now - i * 86400e3).toISOString().slice(0, 10);
    const t = (n - i) / n, wk = [1.25, 0.9, 0.85, 0.9, 0.95, 1.1, 1.3][new Date(d).getUTCDay()];
    const dau = Math.round((180 + 260 * t) * wk * scale * (0.9 + rnd() * 0.2) * (i === 0 ? 0.55 : 1));
    const nw = Math.round(dau * (0.18 + rnd() * 0.08)), games = Math.round(dau * (3.1 + rnd()));
    const pvp = Math.round(games * (0.38 + rnd() * 0.1)), show = Math.round(dau * 0.9), earned = Math.round(show * (0.78 + rnd() * 0.1));
    days.push({ day: d, dau, new: nw, games, games_pvp: pvp, games_ai: games - pvp, tut_pct: +(62 + rnd() * 12).toFixed(1), ad_show: show, ad_earned: earned, ad_inter: Math.round(dau * 0.4),
      ad_pct: +(earned * 100 / show).toFixed(1), match_pct: +(64 + rnd() * 20).toFixed(1), wait_sec: +(4 + rnd() * 5).toFixed(1), shop: Math.round(dau * 0.1), promo: Math.round(nw * 0.3) });
  }
  const retention = days.slice(-30).reverse().map((x, i) => ({ day: x.day, new: x.new, d1: i >= 2 ? +(28 + rnd() * 14).toFixed(1) : null, d7: i >= 8 ? +(9 + rnd() * 8).toFixed(1) : null }));
  const players = Math.round(5200 * scale);
  return { v: 1, game: id, totals: { players, toss: Math.round(players * 0.72), play: Math.round(players * 0.21), guest: players - Math.round(players * 0.72) - Math.round(players * 0.21), active7: Math.round(players * 0.24), pvp_total: Math.round(players * 6.3), promo_total: Math.round(players * 0.31) }, days, retention };
}
if (DEMO) { GAMES[0].url = GAMES[1].url = 'demo'; } // TERRAFRONT는 연결 전 모습으로

// ── 시작 ─────────────────────────────
syncRange();
if (key || DEMO) { open_(); loadAll(); } else { $('#pw').focus(); }
</script>
